<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="getIntersection returns the overlapping region: x and y are the larger left and top edges, width and height reach to the smaller right and bottom edges.">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <style>
      .m   { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; fill:#000000; }
      .lbl { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; }
      .gd  { stroke:#000000; stroke-width:1; stroke-dasharray:4 4; opacity:.5; }
      .dim { stroke:#000000; stroke-width:1.2; }
    </style>
  </defs>

  <rect x="70"  y="60"  width="250" height="150" fill="#0000FF" fill-opacity=".12" stroke="#0000FF" stroke-width="2"/>
  <rect x="220" y="140" width="250" height="150" fill="#fc8803" fill-opacity=".12" stroke="#fc8803" stroke-width="2"/>
  <rect x="220" y="140" width="100" height="70"  fill="#7700ff" fill-opacity=".38" stroke="#7700ff" stroke-width="2"/>

  <text class="lbl" x="94"  y="84"  fill="#0000FF">a</text>
  <text class="lbl" x="446" y="278" fill="#fc8803">b</text>

  <!-- callout for the returned rect -->
  <line class="gd" x1="290" y1="172" x2="392" y2="112"/>
  <circle cx="290" cy="172" r="3" fill="#7700ff"/>
  <text class="m" x="400" y="109" fill="#7700ff">getIntersection(a, b)</text>

  <!-- origin of the overlap -->
  <circle cx="220" cy="140" r="4.5" fill="#7700ff"/>
  <text class="m" x="220" y="130" text-anchor="middle" fill="#7700ff">(x, y)</text>

  <!-- width dimension, below both boxes -->
  <line class="gd" x1="220" y1="210" x2="220" y2="322"/>
  <line class="gd" x1="320" y1="210" x2="320" y2="322"/>
  <line class="dim" x1="220" y1="316" x2="320" y2="316" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
  <text class="m" x="270" y="308" text-anchor="middle">width</text>

  <!-- height dimension, right of both boxes -->
  <line class="gd" x1="320" y1="140" x2="516" y2="140"/>
  <line class="gd" x1="320" y1="210" x2="516" y2="210"/>
  <line class="dim" x1="510" y1="140" x2="510" y2="210" marker-start="url(#ar2)" marker-end="url(#ar2)"/>
  <text class="m" x="522" y="179">height</text>

  <!-- formulas -->
  <text class="m" xml:space="preserve" x="70" y="360">x      = max(left(a),   left(b))</text>
  <text class="m" xml:space="preserve" x="70" y="378">y      = max(top(a),    top(b))</text>
  <text class="m" xml:space="preserve" x="70" y="396">width  = min(right(a),  right(b))  - x</text>
  <text class="m" xml:space="preserve" x="70" y="414">height = min(bottom(a), bottom(b)) - y</text>
</svg>
