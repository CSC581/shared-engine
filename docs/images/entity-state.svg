<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img" aria-label="An Entity stores position, size and velocity. update(deltaTime) advances each axis of position by that axis's velocity times deltaTime, moving the entity to a new top-left corner while its size is unchanged.">
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="vel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7700ff"/>
    </marker>
    <style>
      .m   { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; fill:#000000; }
      .lbl { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:14px; }
      .gd  { stroke:#000000; stroke-width:1; stroke-dasharray:4 4; opacity:.5; }
      .dim { stroke:#000000; stroke-width:1.2; }
      .v   { stroke:#7700ff; stroke-width:1.8; }
    </style>
  </defs>

  <!-- entity after update(deltaTime) -->
  <rect x="290" y="150" width="170" height="100" fill="#fc8803" fill-opacity=".12" stroke="#fc8803" stroke-width="2"/>
  <circle cx="290" cy="150" r="4" fill="#fc8803"/>
  <text class="m" x="460" y="268" text-anchor="end" fill="#fc8803">after update(deltaTime)</text>

  <!-- entity now -->
  <rect x="90" y="110" width="170" height="100" fill="#0000FF" fill-opacity=".12" stroke="#0000FF" stroke-width="2"/>
  <circle cx="90" cy="110" r="4.5" fill="#0000FF"/>
  <text class="lbl" x="102" y="202" fill="#0000FF">entity</text>
  <text class="m" x="90" y="100" text-anchor="middle" fill="#0000FF">(x_, y_)</text>

  <!-- per-axis velocity, centre to centre -->
  <line class="v" x1="175" y1="160" x2="371" y2="160" marker-end="url(#vel)"/>
  <line class="v" x1="375" y1="160" x2="375" y2="196" marker-end="url(#vel)"/>
  <text class="m" x="273" y="152" text-anchor="middle" fill="#7700ff">velocityX_ &#215; deltaTime</text>
  <text class="m" x="384" y="184" fill="#7700ff">velocityY_ &#215; deltaTime</text>

  <!-- width dimension, below the current box -->
  <line class="gd" x1="90"  y1="210" x2="90"  y2="238"/>
  <line class="gd" x1="260" y1="210" x2="260" y2="238"/>
  <line class="dim" x1="90" y1="232" x2="260" y2="232" marker-start="url(#ar3)" marker-end="url(#ar3)"/>
  <text class="m" x="175" y="252" text-anchor="middle">width_</text>

  <!-- height dimension, left of the current box -->
  <line class="gd" x1="90" y1="110" x2="62" y2="110"/>
  <line class="gd" x1="90" y1="210" x2="62" y2="210"/>
  <line class="dim" x1="68" y1="110" x2="68" y2="210" marker-start="url(#ar3)" marker-end="url(#ar3)"/>
  <text class="m" x="56" y="164" text-anchor="end">height_</text>

  <!-- integration performed by update() -->
  <text class="m" xml:space="preserve" x="90" y="300">update(deltaTime):</text>
  <text class="m" xml:space="preserve" x="90" y="318">  x_ += velocityX_ * deltaTime</text>
  <text class="m" xml:space="preserve" x="90" y="336">  y_ += velocityY_ * deltaTime</text>
  <text class="m" xml:space="preserve" x="360" y="318">width_ and height_ are unchanged;</text>
  <text class="m" xml:space="preserve" x="360" y="336">velocity is unchanged by update().</text>
</svg>
