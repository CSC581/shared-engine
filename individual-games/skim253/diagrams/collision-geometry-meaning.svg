<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 428" width="712" role="img" aria-label="Left of a dividing line, Collision measures geometry only: intersects on two overlapping boxes, getIntersection on the shaded overlap, getSeparation on the shallowest push arrow. A single true crosses the line and fans out to five pictures from the golf game: ball in the cup is sunk, ball in the pond is a penalty, ball on a sail is a bounce, ball on the slope is a stop, ball inside the club reach box is in range. resolve() sits on the line itself.">
  <style>
    .f     { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .c     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg    { fill: #fbfbfa; }
    .ink   { fill: #1f2328; }
    .muted { fill: #6b7280; }
    .muteds{ stroke: #6b7280; }
    .card  { fill: #ffffff; stroke: #c9ced6; stroke-width: 1.2; }
    .line  { stroke: #c9ced6; }
    .solid { fill: #6b7280; fill-opacity: 0.22; }
    .acc   { fill: #3b82f6; }
    .accs  { stroke: #3b82f6; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #14161a; }
      .ink   { fill: #e6e8eb; }
      .muted { fill: #98a1ad; }
      .muteds{ stroke: #98a1ad; }
      .card  { fill: #1a1d22; stroke: #39404a; }
      .line  { stroke: #39404a; }
      .solid { fill: #98a1ad; fill-opacity: 0.20; }
      .acc   { fill: #7aa7f7; }
      .accs  { stroke: #7aa7f7; }
    }
  </style>
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="acc"/>
    </marker>
    <marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="muted"/>
    </marker>
  </defs>

  <rect width="712" height="428" rx="10" class="bg"/>
  <text x="40" y="36" class="f ink" font-size="15" font-weight="600">One overlap, five meanings</text>
  <line x1="428" y1="72" x2="428" y2="398" class="line" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ================= left: geometry ================= -->
  <text x="60" y="60" class="f muted" font-size="10" letter-spacing="0.1em">GEOMETRY</text>

  <rect x="126" y="176" width="94" height="72" rx="4" class="card"/>
  <rect x="126" y="176" width="28" height="40" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-width="1.1"/>
  <rect x="60" y="150" width="94" height="66" rx="4" fill="none" class="accs" stroke-width="1.6"/>

  <line x1="126" y1="256" x2="126" y2="272" class="line" stroke-width="1"/>
  <line x1="154" y1="256" x2="154" y2="272" class="line" stroke-width="1"/>
  <path d="M154,264 L128,264" class="accs" stroke-width="1.5" fill="none" marker-end="url(#ca)"/>

  <rect x="248" y="165" width="14" height="10" fill="none" class="accs" stroke-width="1.3"/>
  <rect x="254" y="169" width="14" height="10" fill="none" class="line" stroke-width="1.3"/>
  <text x="274" y="178" class="c ink" font-size="10">intersects()</text>

  <rect x="248" y="200" width="14" height="11" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-width="1.1"/>
  <text x="274" y="213" class="c ink" font-size="10">getIntersection()</text>

  <path d="M265,245 L249,245" class="accs" stroke-width="1.5" fill="none" marker-end="url(#ca)"/>
  <text x="274" y="248" class="c ink" font-size="10">getSeparation()</text>

  <!-- ================= the answer, on the line ================= -->
  <rect x="396" y="192" width="64" height="27" rx="13.5" class="card"/>
  <text x="428" y="210" class="c acc" font-size="11.5" text-anchor="middle" font-weight="600">true</text>

  <!-- ================= right: meaning ================= -->
  <text x="516" y="60" class="f muted" font-size="10" letter-spacing="0.1em">MEANING</text>

  <path d="M460,204 C482,204 490,101 512,101" class="muteds" stroke-width="1.2" fill="none" stroke-opacity="0.55"/>
  <path d="M460,204 C482,204 490,153 512,153" class="muteds" stroke-width="1.2" fill="none" stroke-opacity="0.55"/>
  <path d="M460,205 L512,205"                 class="muteds" stroke-width="1.2" fill="none" stroke-opacity="0.55"/>
  <path d="M460,206 C482,206 490,257 512,257" class="muteds" stroke-width="1.2" fill="none" stroke-opacity="0.55"/>
  <path d="M460,206 C482,206 490,309 512,309" class="muteds" stroke-width="1.2" fill="none" stroke-opacity="0.55"/>

  <!-- cup -->
  <g transform="translate(516,78)">
    <rect x="36" y="30" width="20" height="14" fill="#f59e0b" fill-opacity="0.22"/>
    <path d="M4,30 H36 V44 H56 V30 H88" fill="none" class="muteds" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M56,30 V8 L72,13 L56,18" fill="none" class="muteds" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="46" cy="37" r="5" class="acc"/>
  </g>
  <text x="624" y="105" class="f ink" font-size="12.5">sunk</text>

  <!-- pond -->
  <g transform="translate(516,130)">
    <path d="M4,24 q5,-5 10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 V44 H4 Z" class="solid"/>
    <path d="M4,24 q5,-5 10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0 t10,0" fill="none" class="muteds" stroke-width="1.4"/>
    <path d="M32,18 L27,8 M52,18 L57,8 M42,16 L42,5" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="42" cy="28" r="5" class="acc"/>
  </g>
  <text x="624" y="157" class="f ink" font-size="12.5">penalty</text>

  <!-- sail -->
  <g transform="translate(516,182)">
    <rect x="52" y="4" width="9" height="40" rx="2" class="solid" transform="rotate(32 56 24)"/>
    <rect x="52" y="4" width="9" height="40" rx="2" fill="none" class="muteds" stroke-width="1.2" transform="rotate(32 56 24)"/>
    <path d="M8,8 L32,20" fill="none" class="muteds" stroke-width="1.4" marker-end="url(#ma)"/>
    <path d="M32,30 L8,42" fill="none" class="muteds" stroke-width="1.4" marker-end="url(#ma)"/>
    <circle cx="45" cy="25" r="6" fill="#f59e0b" fill-opacity="0.45"/>
    <circle cx="39" cy="25" r="5" class="acc"/>
  </g>
  <text x="624" y="209" class="f ink" font-size="12.5">bounce</text>

  <!-- slope -->
  <g transform="translate(516,234)">
    <path d="M4,42 L88,18 V44 H4 Z" class="solid"/>
    <path d="M4,42 L88,18" fill="none" class="muteds" stroke-width="1.6"/>
    <rect x="30" y="28" width="14" height="5" fill="#f59e0b" fill-opacity="0.35" transform="rotate(-16 37 30)"/>
    <path d="M12,12 Q26,34 44,10" fill="none" class="muteds" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#ma)"/>
    <circle cx="37" cy="26" r="5" class="acc"/>
  </g>
  <text x="624" y="261" class="f ink" font-size="12.5">stop</text>

  <!-- reach -->
  <g transform="translate(516,286)">
    <rect x="8" y="6" width="60" height="38" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="4 3"/>
    <rect x="22" y="14" width="11" height="26" rx="2" class="solid"/>
    <rect x="22" y="14" width="11" height="26" rx="2" fill="none" class="muteds" stroke-width="1.2"/>
    <path d="M33,22 L46,32" fill="none" class="muteds" stroke-width="1.3"/>
    <circle cx="53" cy="35" r="5" class="acc"/>
  </g>
  <text x="624" y="313" class="f ink" font-size="12.5">in range</text>

  <!-- ================= resolve() sits on the line ================= -->
  <rect x="274" y="356" width="308" height="42" rx="8" class="card" stroke-dasharray="5 4"/>
  <text x="428" y="382" class="c ink" font-size="11.5" text-anchor="middle" font-weight="600">Collision::resolve()</text>
</svg>
