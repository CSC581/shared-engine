<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 396" width="900" role="img" aria-label="Collision.hpp includes Entity.hpp and each .cpp includes its own header, so every dependency arrow points toward Entity. collidesWith() is declared in Entity.hpp but defined in Collision.cpp, tied by a dotted line. The arrow from Entity.cpp back to Collision is crossed out: it never exists.">
  <style>
    .f     { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .c     { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg    { fill: #fbfbfa; }
    .ink   { fill: #1f2328; }
    .inks  { stroke: #1f2328; }
    .muted { fill: #6b7280; }
    .muteds{ stroke: #6b7280; }
    .card  { fill: #ffffff; stroke: #c9ced6; stroke-width: 1.2; }
    .hole  { fill: #fbfbfa; }
    .acc   { fill: #2563eb; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #14161a; }
      .ink   { fill: #e6e8eb; }
      .inks  { stroke: #e6e8eb; }
      .muted { fill: #98a1ad; }
      .muteds{ stroke: #98a1ad; }
      .card  { fill: #1a1d22; stroke: #39404a; }
      .hole  { fill: #14161a; }
      .acc   { fill: #7aa7f7; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ink"/>
    </marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="muted" fill-opacity="0.55"/>
    </marker>
  </defs>

  <rect width="900" height="396" rx="10" class="bg"/>
  <text x="40" y="42" class="f ink" font-size="15" font-weight="600">Entity &#8596; Collision</text>

  <!-- Entity.hpp -->
  <rect x="90" y="84" width="240" height="86" rx="8" class="card"/>
  <text x="210" y="112" class="c ink" font-size="12.5" font-weight="600" text-anchor="middle">Entity.hpp</text>
  <rect x="106" y="124" width="208" height="30" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="210" y="144" class="c acc" font-size="11" text-anchor="middle">collidesWith()</text>

  <!-- Collision.hpp -->
  <rect x="570" y="84" width="240" height="86" rx="8" class="card"/>
  <text x="690" y="133" class="c ink" font-size="12.5" font-weight="600" text-anchor="middle">Collision.hpp</text>

  <!-- Entity.cpp -->
  <rect x="90" y="234" width="240" height="86" rx="8" class="card"/>
  <text x="210" y="283" class="c ink" font-size="12.5" font-weight="600" text-anchor="middle">Entity.cpp</text>

  <!-- Collision.cpp -->
  <rect x="570" y="234" width="240" height="86" rx="8" class="card"/>
  <text x="690" y="262" class="c ink" font-size="12.5" font-weight="600" text-anchor="middle">Collision.cpp</text>
  <rect x="586" y="274" width="208" height="30" rx="6" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-width="1.1"/>
  <text x="690" y="294" class="c acc" font-size="11" text-anchor="middle">collidesWith()</text>

  <!-- includes -->
  <text x="450" y="104" class="c muted" font-size="10" text-anchor="middle">#include</text>
  <path d="M566,112 L338,112" class="inks" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <path d="M210,230 L210,178" class="inks" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="222" y="208" class="c muted" font-size="10">#include</text>

  <path d="M690,230 L690,178" class="inks" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="702" y="208" class="c muted" font-size="10">#include</text>

  <!-- the seam: declared left, defined right -->
  <path d="M334,142 L566,286" stroke="#3b82f6" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round" fill="none"/>
  <circle cx="334" cy="142" r="3.5" fill="#3b82f6"/>
  <circle cx="566" cy="286" r="3.5" fill="#3b82f6"/>
  <text x="350" y="133" class="f acc" font-size="10.5">declared</text>
  <text x="556" y="304" class="f acc" font-size="10.5" text-anchor="end">defined</text>

  <!-- the arrow that does not exist -->
  <path d="M210,320 L210,352 L690,352 L690,326" class="muteds" stroke-width="1.4" stroke-dasharray="5 4" stroke-opacity="0.5" fill="none" marker-end="url(#arm)"/>
  <circle cx="450" cy="352" r="11" class="hole"/>
  <path d="M444,346 L456,358 M456,346 L444,358" stroke="#ef4444" stroke-width="1.8" stroke-linecap="round"/>
  <text x="450" y="378" class="f muted" font-size="10.5" text-anchor="middle">never</text>
</svg>
